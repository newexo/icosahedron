[tool.poetry]
name = "icosahedron"
version = "0.4.6"
description = "D20 inspired game system generated by AI"
authors = ["Reuben Brasher <rkbrasher@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "icosahedron"}]
include = ["README.md", "icosahedron/tests/test_data/*"]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.3.3"
pydantic = "^2.7.0"
pytest = "^8.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
